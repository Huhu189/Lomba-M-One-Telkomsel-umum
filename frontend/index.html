<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      Nunito (judul) + Nunito Sans (teks) sesuai papan Standar. Bila jaringan
      sekolah memblokir Google Fonts, rantai fallback di theme.css tetap
      memakai huruf sistem sehingga halaman tidak rusak.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Judul + meta halaman dipasang ulang per jalur oleh `shared/seo/meta.js`
      (SPA: satu dokumen untuk puluhan alamat). Yang tertulis di sini adalah
      keadaan sebelum JavaScript jalan — cukup untuk perayap pertama dan untuk
      halaman beranda, yang memang boleh diindeks.
    -->
    <meta
      name="description"
      content="Aplikasi ulangan dan materi sekolah: guru menyusun soal, murid mengerjakan dari tautan kelas, dan nilainya terkumpul otomatis."
    />
    <meta name="robots" content="index, follow" />
    <!--
      Kartu pratinjau tautan (WhatsApp, Telegram, Facebook) dibaca dari berkas
      statis ini: pemindainya tidak menjalankan JavaScript, jadi tag og/twitter
      TIDAK bisa dipasang oleh `shared/seo/meta.js` seperti judul tab di SPA.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ulangan Sekolah" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="Ulangan Sekolah" />
    <meta
      property="og:description"
      content="Buat ulangan, koreksi otomatis, dan materi berjalan untuk kelasmu."
    />
    <meta name="twitter:card" content="summary" />
    <title>Ulangan Sekolah</title>
  </head>
  <body>
    <!--
      Penanda "Menyiapkan…" tampil seketika sebelum JavaScript selesai: yang
      dilihat pengguna lebih dulu bukan halaman putih kosong. React mengganti isi
      #root pada render pertama.
    -->
    <div id="root">
      <div
        style="
          display: flex;
          min-height: 100vh;
          align-items: center;
          justify-content: center;
          font-family: system-ui, sans-serif;
          color: #6b7280;
        "
      >
        Menyiapkan…
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
