<!--
  "Menjelajah Luar Angkasa" — latar peta perjalanan tema Luar Angkasa.

  Dirombak ulang total (bukan disetel sedikit): langit malam tiga tingkat,
  pita galaksi menyilang, tiga nebula berwarna, puluhan bintang berkilau,
  Bumi berawan, sabuk asteroid, Saturnus bercincin, Bulan berkawah, dan
  kompleks peluncuran di kiri bawah.

  Benda CC0 dari luar repo (diunduh ulang, lalu koordinatnya didatar-kan supaya
  tidak ada transform di berkas ini — lihat LISENSI.md di folder ini untuk
  sumber, pembuat, dan lisensinya): roket di landasan, planet Mars, dan satu
  bintang besar. Sisanya digambar di sini (karya sendiri, CC0).

  Bentuknya mengikuti rute pos tema ini (`RUTE_TEMA.angkasa` di
  `frontend/src/sections/material/perjalanan/perjalanan.js`): pos meluncur dari landasan di
  kiri bawah ke Bulan di kanan atas, dan tiap pos berdiri **di atas benda yang
  digambar** — bukan di ruang kosong. Benda itu diberi `id` supaya bisa
  diperiksa mesin:

  - `landasan`  (px 48–352 × 546–820)   → pos "Landasan Peluncuran" (11%, 79%) = (176,711)
  - `bumi`      (lingkaran (430,632) r 206 → px 224–636 × 426–838)
                                        → pos "Orbit Bumi"          (26%, 52%) = (416,468)
  - `asteroid`  (px 686–946 × 392–528)  → pos "Sabuk Asteroid"      (50%, 50%) = (800,450)
  - `saturnus`  (px 900–1500 × 212–448) → pos "Cincin Saturnus"     (72%, 33%) = (1152,297)
  - `bulan`     (lingkaran (1452,196) r 196 → px 1256–1648 × 0–392)
                                        → pos "Bulan"               (86%, 20%) = (1376,180)

  LATAR GELAP, dan itu disengaja: langit malam tidak bisa terang. Karena jalur
  peta bawaan berwarna pekat (dirancang untuk latar terang), tema ini memakai
  aturan jalur terang di `theme.css` (`.jelajah[data-adegan='angkasa']`).
  Pagar mutu `frontend/src/__tests__/theme/latarTema.test.js` menguji dua hal
  yang berbeda untuk berkas ini: **gelap** (tidak menyilaukan) tetapi punya
  bagian **terang** (bintang & Bulan) supaya jalur tetap terbaca.

  Atribut width/height dijaga 1600x900 dan viewBox 16:9 (aturan di LISENSI.md).
-->
