      <stop offset="0%" stop-color="#5566c4" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#5566c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-ungu" cx="50%" cy="50%" r="50%">
