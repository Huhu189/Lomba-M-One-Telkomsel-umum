    <radialGradient id="sorot-angkasa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff3c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

