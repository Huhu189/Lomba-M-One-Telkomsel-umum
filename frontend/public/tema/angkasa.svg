<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Menjelajah Luar Angkasa" — latar peta perjalanan tema Luar Angkasa.

  Dibuat untuk proyek ini (karya sendiri) dan dilepas ke domain publik / CC0,
  jadi boleh dipakai, diubah, dan disebarkan tanpa izin tambahan — lihat
  LISENSI.md di folder ini. Seluruhnya digambar di sini: tidak ada berkas
  unduhan, jadi tidak bergantung jaringan dan tidak ada asal-usul yang perlu
  ditelusuri.

  Bentuknya mengikuti rute pos tema ini (`RUTE_TEMA.angkasa` di
  `frontend/src/sections/material/perjalanan.js`): pos meluncur dari landasan di
  kiri bawah ke Bulan di kanan atas, dan tiap pos berdiri **di atas benda yang
  digambar** — bukan di ruang kosong. Benda itu diberi `id` supaya bisa
  diperiksa mesin:

  - `landasan`  (px 52–348 × 660–800)   → pos "Landasan Peluncuran" (11%, 79%) = (176,711)
  - `bumi`      (lingkaran (430,632) r 184 → px 246–614 × 448–816)
                                        → pos "Orbit Bumi"          (26%, 52%) = (416,468)
  - `asteroid`  (px 686–946 × 392–528)  → pos "Sabuk Asteroid"      (50%, 50%) = (800,450)
  - `saturnus`  (px 964–1440 × 196–446) → pos "Cincin Saturnus"     (72%, 33%) = (1152,297)
  - `bulan`     (lingkaran (1452,196) r 196 → px 1256–1648 × 0–392)
                                        → pos "Bulan"               (86%, 20%) = (1376,180)

  LATAR GELAP, dan itu disengaja: langit malam tidak bisa terang. Karena jalur
  peta bawaan berwarna pekat (dirancang untuk latar terang), tema ini memakai
  aturan jalur terang di `theme.css` (`.jelajah[data-adegan='angkasa']`).
  Pagar mutu `frontend/src/__tests__/theme/latarTema.test.js` menguji dua hal
  yang berbeda untuk berkas ini: **gelap** (tidak menyilaukan) tetapi punya
  bagian **terang** (bintang & Bulan) supaya jalur tetap terbaca.

  Isinya sengaja lebih rimbun daripada sekadar "latar hitam + beberapa bola":
  ada tiga gumpal nebula, galaksi spiral jauh, komet berekor, satelit dengan
  panel surya, sabuk asteroid berbatu dan berdebu, Saturnus berikut cincinnya
  yang melintang di depan planet, Bulan berkawah dengan sisi gelapnya, serta
  kompleks peluncuran (roket, menara, lampu sorot, asap) di kiri bawah.

  Atribut width/height dijaga 1600x900 (aturan di LISENSI.md); viewBox 16:9
  supaya panggung peta tidak memotong Bulan di sudut kanan atas.

  Catatan pemeliharaan: pagar `id` di atas diurai regex `<g id="…">` yang
  BERHENTI di `</g>` pertama, jadi tiap grup ber-id tidak boleh berisi grup
  bersarang — sebuah benda = satu grup datar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
