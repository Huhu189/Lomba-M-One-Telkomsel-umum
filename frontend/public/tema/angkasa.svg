    <linearGradient id="bumi-angkasa" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#5aabec"/>
      <stop offset="55%" stop-color="#2f6fbe"/>
      <stop offset="100%" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="bulan-angkasa" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#f4efe2"/>
      <stop offset="60%" stop-color="#cfc7b7"/>
      <stop offset="100%" stop-color="#948c7d"/>
    </linearGradient>
    <linearGradient id="bintang-jatuh" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cahaya-bulan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8f1ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8f1ff" stop-opacity="0"/>
