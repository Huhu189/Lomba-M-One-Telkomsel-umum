    <radialGradient id="nebula-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fb2c8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4fb2c8" stop-opacity="0"/>
