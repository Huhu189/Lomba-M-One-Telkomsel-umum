      <stop offset="55%" stop-color="#3d4f96"/>
      <stop offset="100%" stop-color="#232c5c"/>
    </linearGradient>
    <radialGradient id="nebula-ungu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a3fb0" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#6a3fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-biru" cx="50%" cy="50%" r="50%">
