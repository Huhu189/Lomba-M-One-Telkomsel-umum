<!--
  "Pendakian bertingkat" — latar peta perjalanan tema Mendaki Gunung.

  Dibuat untuk proyek ini (karya sendiri) dan dilepas ke domain publik / CC0,
  jadi boleh dipakai, diubah, dan disebarkan tanpa izin tambahan — lihat
  LISENSI.md di folder ini.

  Bentuknya mengikuti permintaan pemilik produk pada A.48: *"3 puncak namun
  yang di sebelah-sebelahnya itu menjadi jalur pendakian"* — satu **punggung
  utama** di tengah, plus **dua puncak jalur** persis di jalur zigzag pos
  (sumbu x 14% dan 90%, sedangkan pos bergantian di jalur kiri 12–20% dan
  kanan 80–88%). Aturan bentuknya dikunci `__tests__/theme/gunungLatar.test.js`
  dan diukur, bukan dikira:

  - **tepat SATU puncak utama** yang menonjol 29,8% tinggi bingkai (268 px,
    di x≈52%, y≈39% dari atas) — jadi pos terakhir jalur mendaki tetap berdiri
    di **langit** (pos terakhir digambar di 12% dari atas);
  - **dua puncak jalur** boleh ada — tetapi keduanya **wajib** lebih rendah
    sekurang-kurangnya 10% tinggi bingkai (158 dan 160 px) dan berada **di
    tepi** (|x−50%| ≥ 10%), bukan di tengah; puncak jalur kiri menonjol 81 px
    (9,0%) dan kanan 73 px (8,1%);
  - **punggung utama tumpul**: punggung 9,0% lebar kanvas pada 2,2% tinggi di
    bawah titik tertinggi, kemiringan sisi maksimum 41,3°, putaran antarruas
    maksimum 6,3° (bekas berkas unduhan lama: sisi 90° dan punggung 0% — itulah
    yang terbaca seperti tebing). Siluetnya dibuat dari kurva Catmull-Rom
    sehingga tidak ada sudut berkunci;
  - **tidak ada sisi nyaris tegak yang panjang**: sisi tegak terpanjang 27 px
    (batas tes 36 px);
  - **tidak ada ujung garis yang menggantung**: semua bidang digambar penuh dan
    ditutup (`Z`); goresan terbuka yang tersisa hanya tiga burung kecil di
    langit (masing-masing < 5% lebar kanvas, batas tes 8%);
  - **murni vektor**: tanpa <image> raster, <text>, atau <filter>;
  - **cerah**: 65 nilai warna (min 94, rata 177) supaya jalur zigzag serta tenda
    pos di atasnya tetap terbaca. Pita kabut, bukit berlapis, danau, dan pohon
    memakai palet yang sama seperti sebelumnya; yang berubah adalah
    **komposisinya** (satu puncak → tiga puncak bertingkat).

  Atribut width/height dijaga 1600x900 (sisi terpanjang <= 1600 px, aturan di
  LISENSI.md); viewBox 16:9 supaya panggung peta tidak memotong puncak.
-->
